services:
  gauzy-server:
    image: evercoe/gauzy:latest
    container_name: gauzy-server
    restart: always
    ports:
      - "3000:3000"
      - "4200:4200"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLIENT_BASE_URL=${CLIENT_BASE_URL:-http://localhost:4200}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:3000}
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-gauzy}
      - DB_PASSWORD=${DB_PASSWORD:-gauzy_secret_pass}
      - DB_DATABASE=${DB_DATABASE:-gauzy_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secret_pass}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_ever_gauzy_2025_enterprise}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_key_ever_gauzy_2025}
      - JWT_EXPIRATION_TIME=${JWT_EXPIRATION_TIME:-15m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gauzy-network
    volumes:
      - gauzy-uploads:/gauzy/apps/api/uploads

  postgres:
    image: postgres:16-alpine
    container_name: gauzy-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-gauzy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gauzy_secret_pass}
      POSTGRES_DB: ${DB_DATABASE:-gauzy_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-gauzy} -d ${DB_DATABASE:-gauzy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gauzy-network

  redis:
    image: redis:7-alpine
    container_name: gauzy-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gauzy-network

  nginx:
    image: nginx:1.25-alpine
    container_name: gauzy-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gauzy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gauzy-server
    networks:
      - gauzy-network

networks:
  gauzy-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  gauzy-uploads:
