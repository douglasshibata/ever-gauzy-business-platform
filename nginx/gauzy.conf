# Rate limiting zone for authentication endpoints
limit_req_zone $binary_remote_addr zone=gauzy_auth_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=gauzy_api_limit:10m rate=30r/s;

upstream gauzy_backend {
    server gauzy-server:3000;
    keepalive 32;
}

upstream gauzy_frontend {
    server gauzy-server:4200;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost app.gauzy.local;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_proxied any;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Max Body Size for File Uploads (Screenshots, Invoice Attachments)
    client_max_body_size 50M;

    # API Proxy Routing
    location /api/ {
        limit_req zone=gauzy_api_limit burst=20 nodelay;
        proxy_pass http://gauzy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Strict Rate Limiting on Auth Login Route
    location /api/auth/login {
        limit_req zone=gauzy_auth_limit burst=10 nodelay;
        proxy_pass http://gauzy_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets Proxy Routing (Real-Time Activity & Timers)
    location /socket.io/ {
        proxy_pass http://gauzy_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend SPA Proxy Routing
    location / {
        proxy_pass http://gauzy_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://gauzy_frontend;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
