apiVersion: v1
kind: Service
metadata:
  name: gauzy-service
  namespace: gauzy
  labels:
    app.kubernetes.io/name: gauzy-service
spec:
  type: ClusterIP
  selector:
    app: gauzy-server
  ports:
    - name: api
      port: 3000
      targetPort: 3000
    - name: web
      port: 4200
      targetPort: 4200
