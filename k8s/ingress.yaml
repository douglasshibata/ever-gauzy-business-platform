apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gauzy-ingress
  namespace: gauzy
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/websocket-services: "gauzy-service"
spec:
  tls:
    - hosts:
        - gauzy.yourdomain.com
      secretName: gauzy-tls-secret
  rules:
    - host: gauzy.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gauzy-service
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gauzy-service
                port:
                  number: 4200
