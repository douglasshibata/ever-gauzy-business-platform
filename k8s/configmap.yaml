apiVersion: v1
kind: ConfigMap
metadata:
  name: gauzy-config
  namespace: gauzy
data:
  NODE_ENV: "production"
  PORT: "3000"
  CLIENT_BASE_URL: "https://gauzy.yourdomain.com"
  API_BASE_URL: "https://gauzy.yourdomain.com/api"
  DB_TYPE: "postgres"
  DB_HOST: "postgres-service.gauzy.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "gauzy_db"
  REDIS_HOST: "redis-service.gauzy.svc.cluster.local"
  REDIS_PORT: "6379"
